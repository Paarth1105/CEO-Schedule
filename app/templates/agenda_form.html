{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 20px;">
        <h2 style="margin: 0; color: var(--primary);">Create/Edit Agenda</h2>
        <a href="{{ url_for('dashboard.schedule') }}" class="inline-link">← Back to Schedule</a>
    </div>
    
    <form method="post">
        <!-- Title -->
        <div style="margin-bottom: 15px;">
            <label style="font-weight: bold; display: block; margin-bottom: 6px;">Title</label>
            <input type="text" name="title" value="{{ agenda.title or '' }}" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text);">
        </div>
        
        <!-- Grid for Date/Time/Location/Chairperson -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
            <div>
                <label style="font-weight: bold; display: block; margin-bottom: 6px;">Date</label>
                <input type="text" name="event_date" value="{{ agenda.event_date or '' }}" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text);">
            </div>
            <div>
                <label style="font-weight: bold; display: block; margin-bottom: 6px;">Time</label>
                <input type="text" name="time" value="{{ agenda.time or '' }}" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text);">
            </div>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
            <div>
                <label style="font-weight: bold; display: block; margin-bottom: 6px;">Location</label>
                <input type="text" name="location" value="{{ agenda.location or '' }}" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text);">
            </div>
            <div>
                <label style="font-weight: bold; display: block; margin-bottom: 6px;">Chairperson</label>
                <input type="text" name="chairperson" value="{{ agenda.chairperson or '' }}" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text);">
            </div>
        </div>
        
        <!-- Attendants -->
        <div style="margin-bottom: 15px;">
            <label style="font-weight: bold; display: block; margin-bottom: 6px;">Attendants</label>
            <input type="text" name="attendants" value="{{ agenda.attendants or '' }}" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text);">
        </div>
        
        <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">
        
        <!-- 1) Objective of Meeting -->
        <div style="margin-bottom: 20px;">
            <label style="font-weight: bold; display: block; margin-bottom: 6px; color: var(--primary);">1) Objective of Meeting</label>
            <textarea name="objective" rows="4" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit;" required>{{ agenda.objective or '' }}</textarea>
        </div>
        
        <!-- 2) Schedule Table -->
        <div style="margin-bottom: 20px;">
            <label style="font-weight: bold; display: block; margin-bottom: 8px; color: var(--primary);">2) Schedule of Activity or Meeting</label>
            <div class="table-wrap" style="margin-bottom: 10px; overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="background: var(--surface-alt);">
                            <th style="padding: 10px; text-align: left; border-bottom: 1px solid var(--border); width: 25%;">Time</th>
                            <th style="padding: 10px; text-align: left; border-bottom: 1px solid var(--border); width: 50%;">Activity / Topic</th>
                            <th style="padding: 10px; text-align: left; border-bottom: 1px solid var(--border); width: 25%;">Presenter / Responsible</th>
                            <th style="padding: 10px; text-align: center; border-bottom: 1px solid var(--border); width: 10%;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="schedule-tbody">
                        {% for row in schedule_rows %}
                        <tr>
                            <td style="padding: 8px; border-bottom: 1px solid var(--border);">
                                <input type="text" name="sched_time[]" value="{{ row.time }}" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text);">
                            </td>
                            <td style="padding: 8px; border-bottom: 1px solid var(--border);">
                                <input type="text" name="sched_activity[]" value="{{ row.activity }}" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text);">
                            </td>
                            <td style="padding: 8px; border-bottom: 1px solid var(--border);">
                                <input type="text" name="sched_presenter[]" value="{{ row.presenter }}" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text);">
                            </td>
                            <td style="padding: 8px; border-bottom: 1px solid var(--border); text-align: center;">
                                <button type="button" onclick="removeSchedRow(this)" style="padding: 6px 12px; background: var(--danger); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem;">Remove</button>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            <button type="button" onclick="addSchedRow()" style="padding: 8px 16px; background: var(--primary-soft); color: var(--primary); border: 1px dashed var(--primary); border-radius: 6px; cursor: pointer; font-weight: 500;">+ Add Row</button>
        </div>
        
        <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">
        
        <!-- 3) Follow-Ups of Previous MOM & Tasks -->
        <div style="margin-bottom: 20px;">
            <label style="font-weight: bold; display: block; margin-bottom: 6px; color: var(--primary);">3) Follow-Ups of Previous MOM & Tasks</label>
            <textarea name="follow_ups" rows="3" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit;">{{ agenda.follow_ups or '' }}</textarea>
        </div>
        
        <!-- 4) Tasks to be Done -->
        <div style="margin-bottom: 25px;">
            <label style="font-weight: bold; display: block; margin-bottom: 6px; color: var(--primary);">4) Tasks to be Done</label>
            <textarea name="tasks" rows="3" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit;">{{ agenda.tasks or '' }}</textarea>
        </div>
        
        <!-- Actions -->
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <a href="{{ url_for('dashboard.schedule') }}" class="btn" style="background: transparent; border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 6px; text-decoration: none; display: inline-block; text-align: center;">Cancel</a>
            <button type="submit" style="padding: 10px 24px; background: var(--success); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Save Agenda</button>
        </div>
    </form>
</div>

<script>
function addSchedRow() {
    const tbody = document.getElementById('schedule-tbody');
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td style="padding: 8px; border-bottom: 1px solid var(--border);">
            <input type="text" name="sched_time[]" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text);">
        </td>
        <td style="padding: 8px; border-bottom: 1px solid var(--border);">
            <input type="text" name="sched_activity[]" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text);">
        </td>
        <td style="padding: 8px; border-bottom: 1px solid var(--border);">
            <input type="text" name="sched_presenter[]" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text);">
        </td>
        <td style="padding: 8px; border-bottom: 1px solid var(--border); text-align: center;">
            <button type="button" onclick="removeSchedRow(this)" style="padding: 6px 12px; background: var(--danger); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem;">Remove</button>
        </td>
    `;
    tbody.appendChild(tr);
}

function removeSchedRow(btn) {
    const tr = btn.closest('tr');
    tr.remove();
}
</script>
{% endblock %}
