{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 950px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 20px;">
        <h2 style="margin: 0; color: var(--primary);">Create/Edit Minutes of Meeting (MOM)</h2>
        <a href="{{ url_for('dashboard.schedule') }}" class="inline-link">← Back to Schedule</a>
    </div>
    
    <form method="post">
        <!-- Grid for Date/Time/Location -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px;">
            <div>
                <label style="font-weight: bold; display: block; margin-bottom: 6px;">Meeting Date</label>
                <input type="text" name="meeting_date" value="{{ mom.meeting_date or '' }}" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text);">
            </div>
            <div>
                <label style="font-weight: bold; display: block; margin-bottom: 6px;">Time</label>
                <input type="text" name="time" value="{{ mom.time or '' }}" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text);">
            </div>
            <div>
                <label style="font-weight: bold; display: block; margin-bottom: 6px;">Location</label>
                <input type="text" name="location" value="{{ mom.location or '' }}" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text);">
            </div>
        </div>
        
        <!-- Meeting Agenda -->
        <div style="margin-bottom: 20px;">
            <label style="font-weight: bold; display: block; margin-bottom: 6px;">Meeting Agenda</label>
            <textarea name="meeting_agenda" rows="3" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit;" required>{{ mom.meeting_agenda or '' }}</textarea>
        </div>
        
        <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">
        
        <!-- Discussion Table / Chart -->
        <div style="margin-bottom: 25px;">
            <label style="font-weight: bold; display: block; margin-bottom: 12px; color: var(--primary); font-size: 1.1rem;">Discussion Details Table</label>
            <div class="table-wrap" style="margin-bottom: 15px; overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; min-width: 800px;">
                    <thead>
                        <tr style="background: var(--surface-alt);">
                            <th style="padding: 12px 8px; text-align: center; border-bottom: 1px solid var(--border); width: 8%;">Sr.No</th>
                            <th style="padding: 12px 8px; text-align: left; border-bottom: 1px solid var(--border); width: 22%;">Topic</th>
                            <th style="padding: 12px 8px; text-align: left; border-bottom: 1px solid var(--border); width: 35%;">Points Discussed</th>
                            <th style="padding: 12px 8px; text-align: left; border-bottom: 1px solid var(--border); width: 20%;">Actionable Items</th>
                            <th style="padding: 12px 8px; text-align: left; border-bottom: 1px solid var(--border); width: 15%;">Responsibility</th>
                            <th style="padding: 12px 8px; text-align: center; border-bottom: 1px solid var(--border); width: 5%;"></th>
                        </tr>
                    </thead>
                    <tbody id="mom-tbody">
                        {% for row in mom_rows %}
                        <tr>
                            <td style="padding: 8px 4px; border-bottom: 1px solid var(--border); text-align: center;">
                                <input type="text" name="mom_sr_no[]" value="{% if row.sr_no %}{% if 'Agenda' in row.sr_no|string %}{{ row.sr_no }}{% else %}Agenda {{ row.sr_no }}{% endif %}{% endif %}" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text); text-align: center;">
                            </td>
                            <td style="padding: 8px 4px; border-bottom: 1px solid var(--border);">
                                <input type="text" name="mom_topic[]" value="{{ row.topic }}" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text);">
                            </td>
                            <td style="padding: 8px 4px; border-bottom: 1px solid var(--border);">
                                <textarea name="mom_points[]" rows="2" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text); font-family: inherit;">{{ row.points }}</textarea>
                            </td>
                            <td style="padding: 8px 4px; border-bottom: 1px solid var(--border);">
                                <input type="text" name="mom_actionable[]" value="{{ row.actionable }}" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text);">
                            </td>
                            <td style="padding: 8px 4px; border-bottom: 1px solid var(--border);">
                                <input type="text" name="mom_responsibility[]" value="{{ row.responsibility }}" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text);">
                            </td>
                            <td style="padding: 8px 4px; border-bottom: 1px solid var(--border); text-align: center;">
                                <button type="button" onclick="removeMomRow(this)" style="padding: 6px 12px; background: var(--danger); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem;">Remove</button>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            <button type="button" onclick="addMomRow()" style="padding: 8px 16px; background: var(--primary-soft); color: var(--primary); border: 1px dashed var(--primary); border-radius: 6px; cursor: pointer; font-weight: 500;">+ Add Discussion Item</button>
        </div>
        
        <!-- Actions -->
        <div style="display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--border); padding-top: 20px;">
            <a href="{{ url_for('dashboard.schedule') }}" class="btn" style="background: transparent; border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 6px; text-decoration: none; display: inline-block; text-align: center;">Cancel</a>
            <button type="submit" style="padding: 10px 24px; background: var(--success); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Save MOM</button>
        </div>
    </form>
</div>

<script>
function addMomRow() {
    const tbody = document.getElementById('mom-tbody');
    const rowCount = tbody.rows.length + 1;
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td style="padding: 8px 4px; border-bottom: 1px solid var(--border); text-align: center;">
            <input type="text" name="mom_sr_no[]" value="Agenda ${rowCount}" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text); text-align: center;">
        </td>
        <td style="padding: 8px 4px; border-bottom: 1px solid var(--border);">
            <input type="text" name="mom_topic[]" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text);">
        </td>
        <td style="padding: 8px 4px; border-bottom: 1px solid var(--border);">
            <textarea name="mom_points[]" rows="2" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text); font-family: inherit;"></textarea>
        </td>
        <td style="padding: 8px 4px; border-bottom: 1px solid var(--border);">
            <input type="text" name="mom_actionable[]" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text);">
        </td>
        <td style="padding: 8px 4px; border-bottom: 1px solid var(--border);">
            <input type="text" name="mom_responsibility[]" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text);">
        </td>
        <td style="padding: 8px 4px; border-bottom: 1px solid var(--border); text-align: center;">
            <button type="button" onclick="removeMomRow(this)" style="padding: 6px 12px; background: var(--danger); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem;">Remove</button>
        </td>
    `;
    tbody.appendChild(tr);
    tr.querySelector('input[name="mom_topic[]"]').focus();
}

function removeMomRow(btn) {
    btn.closest('tr').remove();
    reindexRows();
}

function reindexRows() {
    const tbody = document.getElementById('mom-tbody');
    for (let i = 0; i < tbody.rows.length; i++) {
        const srInput = tbody.rows[i].querySelector('input[name="mom_sr_no[]"]');
        if (srInput) {
            srInput.value = "Agenda " + (i + 1);
        }
    }
}
</script>
{% endblock %}
